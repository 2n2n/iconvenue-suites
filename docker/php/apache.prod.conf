# Production Apache config (replaces 000-default.conf in the prod image).
ServerName localhost
ServerTokens Prod
ServerSignature Off

# Sized for one Cloud Run instance (512 MiB). Keep MaxRequestWorkers equal to the service's
# --concurrency (deploy/cloudrun-deploy.sh) so Cloud Run queues extra requests instead of Apache.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers       10
    MaxConnectionsPerChild 1000
</IfModule>

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
