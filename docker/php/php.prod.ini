; Production PHP overrides (loaded after php.ini-production).
expose_php = Off
memory_limit = 256M
; Image validation allows up to 10 MB per file; gallery forms post several at once.
upload_max_filesize = 12M
; Cloud Run rejects HTTP/1 request bodies over 32 MiB before PHP sees them.
post_max_size = 30M
max_file_uploads = 20

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code is baked into the image and only changes on rebuild.
opcache.validate_timestamps = 0
