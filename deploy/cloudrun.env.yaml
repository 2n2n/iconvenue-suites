# Non-secret production config for the Cloud Run service and jobs (gcloud --env-vars-file).
# Safe to commit: secrets (APP_KEY, DB_PASSWORD) come from Secret Manager, and
# deploy/cloudrun-deploy.sh adds APP_URL and DB_HOST at deploy time. See docs/deployment.md.
APP_NAME: "Icon Venue & Suites"
APP_ENV: "production"
APP_DEBUG: "false"
APP_FORCE_HTTPS: "true"
# Tailnet-only access (docs/decisions/2026-11-06-tailnet-only-access.md): the app is served only at
# https://<this host> through the Tailscale gateway on iconvenue-db, and Cloud Run ingress is internal.
# Remove this line (and redeploy) to go back to public on run.app.
APP_PUBLIC_HOST: "iconvenue.tailf0e670.ts.net"
APP_LOCALE: "en"
APP_FALLBACK_LOCALE: "en"
APP_FAKER_LOCALE: "en_US"
APP_MAINTENANCE_DRIVER: "file"
BCRYPT_ROUNDS: "12"

# Cloud Logging reads stderr; there is no persistent local disk.
LOG_CHANNEL: "stderr"
LOG_LEVEL: "info"
LOG_DEPRECATIONS_CHANNEL: "null"

DB_CONNECTION: "mysql"
DB_PORT: "3306"
DB_DATABASE: "iconvenue"
DB_USERNAME: "iconvenue"

SESSION_DRIVER: "database"
SESSION_LIFETIME: "120"
SESSION_ENCRYPT: "false"
SESSION_PATH: "/"
SESSION_SECURE_COOKIE: "true"

BROADCAST_CONNECTION: "log"
FILESYSTEM_DISK: "local"
# Mail is sent synchronously; there is no queue worker.
QUEUE_CONNECTION: "sync"
CACHE_STORE: "database"

# Mail stays in the log until a Resend sending domain is verified (docs/deployment.md → Mail).
MAIL_MAILER: "log"
MAIL_HOST: "smtp.resend.com"
MAIL_PORT: "587"
MAIL_USERNAME: "resend"
MAIL_FROM_ADDRESS: "bookings@example.com"
MAIL_FROM_NAME: "Icon Venue & Suites"
